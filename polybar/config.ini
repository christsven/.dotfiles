[colors]
# #background = #B0282A2E
# background-alt = #373B41
# #foreground = #C5C8C6
# #primary = #F0C674
# #secondary = #8ABEB7
alert = #A54242
# disabled = #707880
# background = #D0342A21
# foreground = #C9B79C
# primary = #DA667B 
# #secondary = #71816D
# secondary = #b79f7b
# #tray-background = #D0040303

background = #b00c0101
background-alt = #342a21 
#taken from the i3 unfocused window
foreground = #c9b79c
primary = #f8e5c2
secondary = #60644b
accent = #97a587
disabled = #60644B

[bar-settings]
#eg the bar underneath the selected workspace
line-size=3pt
#the distance to the edge of screen
border-size=0pt
#height of bar
height=25pt

[bar/base]
bottom = false
width = 100%
height = ${bar-settings.height}
radius = 0 
; dpi = 96
border-bottom-size = 1pt
border-bottom-color = ${colors.background-alt}

background = ${colors.background}
foreground = ${colors.foreground}

line-size = ${bar-settings.line-size}
border-size = ${bar-settings.border-size} 
border-color = ${colors.foreground} 
padding-left = 0
padding-right = 15px 

module-margin = 0  
separator = " "
separator-foreground = ${colors.disabled}

#font-0 = ${colors.font}:size=12;2
font-0 = Jetbrains Mono Nerd Font:size=10;2
font-1 = Monospace:size=14;2

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

pin-workspaces = true
group-by-monitor = true
enable-scroll = false

; wm-restack = generic
; wm-restack = bspwm
; wm-restack = i3

; override-redirect = true

# right monitor
[bar/bottombar1]
inherit = bar/base
monitor = HDMI-A-0

modules-left = xworkspaces 
modules-center = motd 
modules-right =  systray separator temperature memory cpu network separator pulseaudio separator date separator powermenu

# left monitor
[bar/bottombar2]
monitor = HDMI-A-1
inherit = bar/base

modules-left = xworkspaces  
modules-center = motd 
modules-right = temperature memory cpu network separator pulseaudio separator date separator powermenu

[module/separator]
type = custom/text

content = "|"
content-foreground = ${colors.disabled}
content-padding = 0

[module/temperature]
type = internal/temperature
interval = 3
thermal-zone = 0


[module/systray]
type = internal/tray

format-margin = 4pt
tray-spacing = 8pt

[module/xworkspaces]
type = internal/xworkspaces

pin-workspaces = true
group-by-montitor = true

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.primary}
label-active-padding = 1
label-active-font = 2

label-occupied = %name%
label-occupied-padding = 1
label-occupied-font = 2

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1
label-urgent-font = 2

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1
label-empty-font = 2

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

[module/filesystem]
type = internal/fs
interval = 25

mount-0 = /

label-mounted = %{F#F0C674}%mountpoint%%{F-} %percentage_used%%

label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio
interval = 2

#format-volume-prefix = "󰕾 "
format-volume = <ramp-volume> <label-volume>

label-volume = %percentage%%
format-volume-foreground = ${colors.secondary}
format-volume-underline = ${colors.secondary}

label-muted = "󰖁  0%"
# muted label with bottom bar
label-muted-foreground = ${colors.disabled}
#label-muted-background = ${colors.background-alt}
label-muted-underline = ${colors.disabled}
label-muted-spacing = 5px

# dont @ me bitch
ramp-volume-0 = 󰕾
ramp-volume-1 = 󰕾
ramp-volume-2 = 󰕾

ramp-volume-foreground = ${colors.primary}

click-right = pavucontrol
;use-ui-max = false 

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

label-layout = %layout%
label-layout-foreground = ${colors.primary}

label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

[module/memory]
type = internal/memory
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.primary}

label = %percentage_used:3%%
label-foreground = ${colors.secondary}

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.primary}

label = %percentage:3%%
label-foreground = ${colors.secondary}

#[network-base]
#type = internal/network
#interval = 10
#format-connected = <label-connected>
#format-disconnected = <label-disconnected>
#label-disconnected = %{F#F0C674}%ifname%%{F#707880} disconnected
#[module/wlan]
#inherit = network-base
#interface-type = wireless
#label-connected = %{F#F0C674}%ifname%%{F-} %essid% %local_ip%
#[module/eth]
#inherit = network-base
#interface-type = wired 
#label-connected = %{F#F0C674}%ifname%%{F-} %local_ip% 
#format-label-connected-foreground = ${colors.primary}

[module/date]
type = internal/date
interval = 1

date= %d.%m.%Y %H:%M
date-alt = %H:%M

label = %date%
label-foreground = ${colors.foreground}

# TODO add packetloss animation
[module/network]
type = internal/network
interface = enp14s0 
interval = 2.0

format-connected = <ramp-signal> <label-connected>
# name = %ifname%
label-connected =   %upspeed%   %downspeed%
label-connected-foreground = ${colors.secondary}

format-disconnected = <label-disconnected>
label-disconnected = Offline
label-disconnected-background = ${colors.bg}
label-disconnected-foreground = ${colors.alert}
label-disconnected-padding = 1

ramp-signal-0 = 󰣾
ramp-signal-1 = 󰣴
ramp-signal-2 = 󰣶
ramp-signal-3 = 󰣶
ramp-signal-4 = 󰣸
ramp-signal-5 = 󰣺

ramp-signal-foreground = ${colors.primary}

[module/powermenu]
type = custom/menu

expand-right = true

format-spacing = 1

label-open = " ⏻ "
label-open-foreground = ${colors.primary}
label-open-underline = ${colors.secondary}

label-close = " ✗ "
label-close-foreground = ${colors.primary}
label-close-underline = ${colors.disabled}
label-separator = 
label-separator-foreground = ${colors.foreground}

;Powermenu
menu-0-0 = "Sleep"
menu-0-0-exec = menu-open-1
menu-0-0-foreground = ${colors.foreground}
menu-0-0-underline = ${colors.secondary}

menu-0-1 = "Reboot"
menu-0-1-exec = menu-open-2
menu-0-1-foreground = ${colors.foreground}
menu-0-1-underline = ${colors.secondary}

menu-0-2 = "Shutdown"
menu-0-2-exec = menu-open-3
menu-0-2-foreground = ${colors.foreground}
menu-0-2-underline = ${colors.secondary}

;Hibernate
menu-1-0 = "Cancel"
menu-1-0-exec = menu-open-0
menu-1-0-foreground = ${colors.foreground}
menu-1-0-underline = ${colors.secondary}
menu-1-1 = "Sleep"
menu-1-1-exec = systemctl hibernate
menu-1-1-foreground = ${colors.foreground}
menu-1-1-underline = ${colors.secondary}

;Reboot
menu-2-0 = "Cancel"
menu-2-0-exec = menu-open-0
menu-2-0-foreground = ${colors.foreground}
menu-2-0-underline = ${colors.secondary}
menu-2-1 = "Reboot"
menu-2-1-exec = systemctl reboot
menu-2-1-foreground = ${colors.foreground}
menu-2-1-underline = ${colors.secondary}

;Shutdown
menu-3-0 = "Cancel"
menu-3-0-exec = menu-open-0
menu-3-0-foreground = ${colors.foreground}
menu-3-0-underline = ${colors.secondary}
menu-3-1 = "Shutdown"
menu-3-1-exec = systemctl poweroff
menu-3-1-foreground = ${colors.foreground}
menu-3-1-underline = ${colors.secondary}

[module/motd]
type = custom/script 
exec = ~/.config/polybar/scripts/motd.sh
interval = 60000
label = %output%
label-active-font = 1 

format-fail = <label-fail>
label-fail = %output:0:215:...%

[settings]
screenchange-reload = true

; vim:ft=dosini


